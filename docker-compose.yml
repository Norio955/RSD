version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: travel_db
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: password
      POSTGRES_DB: travel_planner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: